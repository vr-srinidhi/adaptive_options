server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all client-side routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend.
    # BACKEND_URL is substituted at container startup via envsubst.
    # Local Docker Compose: BACKEND_URL=http://backend:8000 (default)
    # Railway: BACKEND_URL=http://adaptiveoptions.railway.internal:8000 (private networking)
    location /api/ {
        # Resolve the backend per request rather than once at startup.
        # A literal hostname in proxy_pass is resolved a single time and cached
        # for the life of the process; on Railway the backend's private IP
        # changes on every deploy, which strands nginx on a dead address and
        # 504s every API call. Going through $backend_url forces a lookup that
        # honours the TTL below.
        resolver ${RESOLVER} valid=10s ipv6=on;
        resolver_timeout 5s;
        set $backend_url "${BACKEND_URL}";
        # $request_uri is required: with a variable in proxy_pass, nginx no
        # longer appends the matched URI automatically.
        proxy_pass $backend_url$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Required when BACKEND_URL is https:// — sends SNI so Railway's
        # TLS terminator knows which certificate to present.
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
